name: Validate DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Backend and dashboard audits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete project doctor
        env:
          BOT_MODE: dev
        run: npm run doctor
      - name: Build dashboard
        run: npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
