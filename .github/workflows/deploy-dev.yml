name: Deploy Goliath
run-name: Deploy Goliath → ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy from DEV
        required: true
        default: beta
        type: choice
        options:
          - beta
          - production

permissions:
  contents: write
  statuses: write

concurrency:
  group: deploy-goliath-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record DEV commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate DEV
        run: |
          set -euo pipefail
          BOT_MODE=dev npm run doctor
          node test/auditEmbedGraphicHeaders.js

          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const maintenance = fs.readFileSync('src/owner/dev/maintenanceStatus.js', 'utf8');
          assert(maintenance.includes('message.system !== true'));
          assert(maintenance.includes('message.editable !== false'));
          const bootstrap = fs.readFileSync('src/runtime/runtimeBootstrap.js', 'utf8');
          assert(bootstrap.includes('setMaxListeners'));
          assert(bootstrap.includes('Math.max(client.getMaxListeners(), 25)'));
          const duplicator = fs.readFileSync('src/owner/dev/duplicator/core.js', 'utf8');
          assert(duplicator.includes('bridgeUnavailable'));
          assert(duplicator.includes("error?.code === 'EADDRINUSE'"));
          console.log('✅ DEV runtime hardening invariants verified');
          NODE

          rm -rf dist
          npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn

          mkdir -p dist/appeals
          cp dist/index.html dist/appeals/index.html

          grep -q 'GOLIATH_APPEALS_ENTRY_V2' dist/assets/*.js || {
            echo "Appeals frontend marker missing from DEV bundle." >&2
            exit 1
          }

  promote:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_sha: ${{ steps.promote.outputs.deploy_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0

      - name: Promote DEV to selected environment
        id: promote
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.environment }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail

          case "$TARGET_BRANCH" in
            beta|production) ;;
            *) echo "Unsupported target: $TARGET_BRANCH" >&2; exit 1 ;;
          esac

          git fetch --no-tags origin dev "$TARGET_BRANCH"
          TARGET_SHA="$(git rev-parse "origin/$TARGET_BRANCH")"
          SOURCE_TREE="$(git show -s --format=%T "$SOURCE_SHA")"

          git config user.name "Goliath Deploy"
          git config user.email "goliath-deploy@users.noreply.github.com"

          PROMOTED_SHA="$(printf 'Promote DEV %s to %s\n' "$SOURCE_SHA" "$TARGET_BRANCH" | git commit-tree "$SOURCE_TREE" -p "$TARGET_SHA")"
          git push origin "$PROMOTED_SHA:refs/heads/$TARGET_BRANCH"

          REMOTE_SHA="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          [ "$REMOTE_SHA" = "$PROMOTED_SHA" ] || {
            echo "Promotion verification failed: $REMOTE_SHA != $PROMOTED_SHA" >&2
            exit 1
          }

          echo "deploy_sha=$PROMOTED_SHA" >> "$GITHUB_OUTPUT"
          echo "✅ DEV $SOURCE_SHA promoted to $TARGET_BRANCH at $PROMOTED_SHA"

  deploy:
    needs: [preflight, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Deploy and verify selected environment
        uses: appleboy/ssh-action@v1
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          EXPECTED_SHA: ${{ needs.promote.outputs.deploy_sha }}
          GITHUB_DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          envs: ENVIRONMENT,EXPECTED_SHA,GITHUB_DEPLOY_TOKEN
          script: |
            set -euo pipefail

            case "$ENVIRONMENT" in
              beta)
                TARGET_BRANCH="beta"
                APP_DIR="/home/goliath/beta"
                RUNTIME_DIR="$APP_DIR/src/runtime/beta"
                PM2_NAME="goliath-beta"
                DEPLOY_SCRIPT="/home/goliath/deploy-beta.sh"
                ;;
              production)
                TARGET_BRANCH="production"
                APP_DIR="/home/goliath/production"
                RUNTIME_DIR="$APP_DIR/src/runtime/production"
                PM2_NAME="goliath-production"
                DEPLOY_SCRIPT="/home/goliath/deploy-production.sh"
                ;;
              *) echo "Unsupported environment: $ENVIRONMENT" >&2; exit 1 ;;
            esac

            [ -d "$APP_DIR/.git" ] || {
              echo "Missing checkout: $APP_DIR" >&2
              exit 1
            }

            cd "$APP_DIR"
            AUTH_URL="https://x-access-token:${GITHUB_DEPLOY_TOKEN}@github.com/${{ github.repository }}.git"
            git remote set-url origin "$AUTH_URL"

            cleanup_remote() {
              git remote set-url origin "https://github.com/${{ github.repository }}.git" || true
            }
            trap cleanup_remote EXIT

            git fetch --no-tags origin "$TARGET_BRANCH"
            REMOTE_SHA="$(git rev-parse "origin/$TARGET_BRANCH")"
            [ "$REMOTE_SHA" = "$EXPECTED_SHA" ] || {
              echo "Target branch moved before deployment: $REMOTE_SHA != $EXPECTED_SHA" >&2
              exit 1
            }

            if [ -n "$(git status --porcelain -- . ':!src/runtime/')" ]; then
              echo "$ENVIRONMENT VPS has changes outside src/runtime; refusing to overwrite them." >&2
              git status --short -- . ':!src/runtime/' >&2
              exit 1
            fi

            BACKUP_DIR="/home/goliath/.goliath-${ENVIRONMENT}-runtime-deploy-backup"
            rm -rf "$BACKUP_DIR"
            mkdir -p "$BACKUP_DIR"
            if [ -d "$RUNTIME_DIR" ]; then
              tar --warning=no-file-changed --ignore-failed-read --exclude='*.tmp' -C "$RUNTIME_DIR" -cf - . | tar -C "$BACKUP_DIR" -xf -
            fi

            restore_runtime() {
              mkdir -p "$RUNTIME_DIR"
              rm -rf "$RUNTIME_DIR"/* "$RUNTIME_DIR"/.[!.]* "$RUNTIME_DIR"/..?* 2>/dev/null || true
              if [ -d "$BACKUP_DIR" ]; then
                tar -C "$BACKUP_DIR" -cf - . | tar -C "$RUNTIME_DIR" -xf -
              fi
            }

            deploy_cleanup() {
              status=$?
              restore_runtime
              rm -rf "$BACKUP_DIR"
              cleanup_remote
              exit "$status"
            }
            trap deploy_cleanup EXIT

            git reset --hard "$EXPECTED_SHA"
            restore_runtime

            npm ci
            BOT_MODE="$ENVIRONMENT" npm run doctor

            rm -rf dist
            npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn

            DASHBOARD_ROOT="$(awk '$1 == "rm" && $2 == "-rf" && $3 ~ /^\/var\/www\// { print $3; exit }' "$DEPLOY_SCRIPT" 2>/dev/null || true)"
            case "$DASHBOARD_ROOT" in
              /var/www/*) ;;
              *) echo "Unsafe or unresolved dashboard root: ${DASHBOARD_ROOT:-unset}" >&2; exit 1 ;;
            esac

            rm -rf "$DASHBOARD_ROOT"
            mkdir -p "$DASHBOARD_ROOT"
            cp -a dist/. "$DASHBOARD_ROOT/"
            nginx -t
            systemctl reload nginx

            BOT_MODE="$ENVIRONMENT" \
              COMMAND_SYNC_DELETE_STALE=true \
              COMMAND_SYNC_UPDATE_EXISTING=true \
              node -e "require('./src/core/commands/syncCommands').syncCommands().then(() => process.exit(0)).catch((error) => { console.error(error); process.exit(1); })"

            if pm2 describe "$PM2_NAME" >/dev/null 2>&1; then
              pm2 restart "$PM2_NAME" --update-env
            else
              BOT_MODE="$ENVIRONMENT" NODE_ENV="$ENVIRONMENT" pm2 start ecosystem.config.js --only "$PM2_NAME" --update-env
            fi
            pm2 save
            sleep 3

            FINAL_SHA="$(git rev-parse HEAD)"
            REMOTE_SHA="$(git rev-parse origin/$TARGET_BRANCH)"
            [ "$FINAL_SHA" = "$EXPECTED_SHA" ]
            [ "$FINAL_SHA" = "$REMOTE_SHA" ]

            PID="$(pm2 pid "$PM2_NAME" 2>/dev/null | tail -n 1 | tr -d '[:space:]')"
            [ -n "$PID" ] && [ "$PID" != "0" ]
            PROCESS_CWD="$(readlink -f "/proc/$PID/cwd")"
            [ "$PROCESS_CWD" = "$APP_DIR" ]

            echo "✅ $ENVIRONMENT deployment verified"
            echo "   branch: $TARGET_BRANCH"
            echo "   commit: $FINAL_SHA"
            echo "   pm2:    $PM2_NAME"

            restore_runtime
            rm -rf "$BACKUP_DIR"
            trap - EXIT
            cleanup_remote

  summary:
    needs: [preflight, promote, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write deployment summary
        shell: bash
        run: |
          {
            echo "## Deploy Goliath"
            echo ""
            echo "- Source: **DEV**"
            echo "- Target: **${{ inputs.environment }}**"
            echo "- DEV validation: **${{ needs.preflight.result }}**"
            echo "- Branch promotion: **${{ needs.promote.result }}**"
            echo "- VPS deployment: **${{ needs.deploy.result }}**"
            echo "- Deployed commit: `${{ needs.promote.outputs.deploy_sha }}`"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "${{ needs.deploy.result }}" = "success" ]
