name: Deploy Goliath

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: beta
        type: choice
        options:
          - dev
          - beta
          - production

permissions:
  contents: write
  statuses: write

# Never cancel an in-flight validation. Rapid pushes are queued so every commit gets a
# deterministic preflight result instead of being left as an ambiguous cancelled run.
concurrency:
  group: deploy-${{ github.event_name == 'push' && 'dev' || inputs.environment }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      source_branch: ${{ steps.target.outputs.source_branch }}
      source_ref: ${{ steps.target.outputs.source_ref }}
      target_branch: ${{ steps.target.outputs.target_branch }}
      deploy_script: ${{ steps.target.outputs.deploy_script }}
      app_dir: ${{ steps.target.outputs.app_dir }}
      runtime_dir: ${{ steps.target.outputs.runtime_dir }}
      pm2_name: ${{ steps.target.outputs.pm2_name }}
    steps:
      - name: Resolve target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          ENVIRONMENT="${{ github.event_name == 'push' && 'dev' || inputs.environment }}"

          case "$ENVIRONMENT" in
            dev)
              SOURCE_BRANCH="dev"; TARGET_BRANCH="dev"
              DEPLOY_SCRIPT="/home/goliath/deploy-dev.sh"
              APP_DIR="/home/goliath/dev"; RUNTIME_DIR="$APP_DIR/src/runtime/dev"
              PM2_NAME="goliath-dev"
              ;;
            beta)
              SOURCE_BRANCH="dev"; TARGET_BRANCH="beta"
              DEPLOY_SCRIPT="/home/goliath/deploy-beta.sh"
              APP_DIR="/home/goliath/beta"; RUNTIME_DIR="$APP_DIR/src/runtime/beta"
              PM2_NAME="goliath-beta"
              ;;
            production)
              SOURCE_BRANCH="beta"; TARGET_BRANCH="production"
              DEPLOY_SCRIPT="/home/goliath/deploy-production.sh"
              APP_DIR="/home/goliath/production"; RUNTIME_DIR="$APP_DIR/src/runtime/production"
              PM2_NAME="goliath-production"
              ;;
            *) exit 1 ;;
          esac

          if [ "${{ github.event_name }}" = "push" ]; then
            SOURCE_REF="${{ github.sha }}"
          else
            SOURCE_REF="$SOURCE_BRANCH"
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "deploy_script=$DEPLOY_SCRIPT" >> "$GITHUB_OUTPUT"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "runtime_dir=$RUNTIME_DIR" >> "$GITHUB_OUTPUT"
          echo "pm2_name=$PM2_NAME" >> "$GITHUB_OUTPUT"

  preflight:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      source_sha: ${{ steps.sha.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record source commit
        id: sha
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "$SHA" != "${{ github.sha }}" ]; then
            echo "Preflight checkout drifted from triggering commit: expected ${{ github.sha }}, got $SHA" >&2
            exit 1
          fi
      - name: Mark preflight pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="$(git rev-parse HEAD)"
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -d '{"state":"pending","context":"goliath/preflight","description":"Goliath preflight is running"}'
      - name: Validate source
        run: |
          set -euo pipefail
          npm run doctor
          npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
      - name: Mark preflight successful
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="$(git rev-parse HEAD)"
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -d '{"state":"success","context":"goliath/preflight","description":"Doctor and dashboard build passed"}'
      - name: Mark preflight failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="$(git rev-parse HEAD 2>/dev/null || echo '${{ github.sha }}')"
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -d '{"state":"failure","context":"goliath/preflight","description":"Goliath preflight failed"}'

  promote:
    needs: [resolve, preflight]
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_sha: ${{ steps.promote.outputs.deploy_sha }}
      previous_target_sha: ${{ steps.promote.outputs.previous_target_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
      - name: Promote validated source into target branch
        id: promote
        shell: bash
        env:
          SOURCE_BRANCH: ${{ needs.resolve.outputs.source_branch }}
          TARGET_BRANCH: ${{ needs.resolve.outputs.target_branch }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail

          if [ "$SOURCE_BRANCH" = "$TARGET_BRANCH" ]; then
            echo "No branch promotion required for $TARGET_BRANCH."
            echo "previous_target_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            echo "deploy_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin "$TARGET_BRANCH"
          TARGET_SHA="$(git rev-parse "origin/$TARGET_BRANCH")"
          SOURCE_TREE="$(git show -s --format=%T "$SOURCE_SHA")"

          echo "Promoting validated $SOURCE_BRANCH $SOURCE_SHA into $TARGET_BRANCH (previous $TARGET_SHA)."

          git config user.name "Goliath Deploy"
          git config user.email "goliath-deploy@users.noreply.github.com"
          PROMOTED_SHA="$(printf 'Promote %s %s to %s\n' "$SOURCE_BRANCH" "$SOURCE_SHA" "$TARGET_BRANCH" | git commit-tree "$SOURCE_TREE" -p "$TARGET_SHA")"

          git push origin "$PROMOTED_SHA:refs/heads/$TARGET_BRANCH"

          REMOTE_SHA="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          [ "$REMOTE_SHA" = "$PROMOTED_SHA" ] || {
            echo "Promotion verification failed: expected $PROMOTED_SHA, got $REMOTE_SHA" >&2
            exit 1
          }

          echo "previous_target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "deploy_sha=$PROMOTED_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [resolve, preflight, promote]
    if: needs.promote.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy affected components
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          TARGET_BRANCH: ${{ needs.resolve.outputs.target_branch }}
          DEPLOY_SCRIPT: ${{ needs.resolve.outputs.deploy_script }}
          APP_DIR: ${{ needs.resolve.outputs.app_dir }}
          RUNTIME_DIR: ${{ needs.resolve.outputs.runtime_dir }}
          PM2_NAME: ${{ needs.resolve.outputs.pm2_name }}
          EXPECTED_SHA: ${{ needs.promote.outputs.deploy_sha }}
          FORCE_COMMAND_SYNC: ${{ github.event_name == 'workflow_dispatch' }}
          PUSH_TRIGGERED: ${{ github.event_name == 'push' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 25m
          envs: ENVIRONMENT,TARGET_BRANCH,DEPLOY_SCRIPT,APP_DIR,RUNTIME_DIR,PM2_NAME,EXPECTED_SHA,FORCE_COMMAND_SYNC,PUSH_TRIGGERED
          script: |
            set -euo pipefail
            [ -d "$APP_DIR/.git" ] || { echo "Missing checkout: $APP_DIR"; exit 1; }
            cd "$APP_DIR"

            OLD_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
            git fetch origin "$TARGET_BRANCH"
            git cat-file -e "$EXPECTED_SHA^{commit}"

            if [ "$PUSH_TRIGGERED" = "true" ]; then
              LATEST_REMOTE_SHA="$(git rev-parse "origin/$TARGET_BRANCH")"
              if [ "$EXPECTED_SHA" != "$LATEST_REMOTE_SHA" ]; then
                echo "Skipping stale deployment for $EXPECTED_SHA; latest origin/$TARGET_BRANCH is $LATEST_REMOTE_SHA."
                exit 0
              fi
            fi

            BACKUP_DIR="/home/goliath/.goliath-${ENVIRONMENT}-runtime-deploy-backup"
            rm -rf "$BACKUP_DIR"; mkdir -p "$BACKUP_DIR"
            if [ -d "$RUNTIME_DIR" ]; then
              # Runtime stores are live while deploy runs. Ignore the benign GNU tar
              # exit caused by files changing during the read, while still excluding
              # atomic temp files and failing on genuine extraction/archive errors.
              set +e
              tar --warning=no-file-changed --ignore-failed-read --exclude='*.tmp' -C "$RUNTIME_DIR" -cf - . | tar -C "$BACKUP_DIR" -xf -
              SNAPSHOT_STATUS=$?
              set -e
              if [ "$SNAPSHOT_STATUS" -ne 0 ]; then
                echo "Runtime snapshot failed with status $SNAPSHOT_STATUS" >&2
                exit "$SNAPSHOT_STATUS"
              fi
            fi

            restore_runtime() {
              mkdir -p "$RUNTIME_DIR"
              if [ -d "$BACKUP_DIR" ]; then
                rm -rf "$RUNTIME_DIR"/* "$RUNTIME_DIR"/.[!.]* "$RUNTIME_DIR"/..?* 2>/dev/null || true
                tar -C "$BACKUP_DIR" -cf - . | tar -C "$RUNTIME_DIR" -xf -
              fi
            }
            cleanup() { status=$?; restore_runtime; rm -rf "$BACKUP_DIR"; exit "$status"; }
            trap cleanup EXIT

            git checkout "$TARGET_BRANCH"
            git reset --hard "$EXPECTED_SHA"
            restore_runtime

            echo "Goliath deployment: $ENVIRONMENT ${OLD_SHA:-unknown} -> $EXPECTED_SHA"
            PLAN_ERROR="$(mktemp)"
            if PLAN="$(node scripts/goliath.js deploy-plan "$OLD_SHA" "$EXPECTED_SHA" --env 2>"$PLAN_ERROR")"; then
              echo "$PLAN"
              eval "$PLAN"
            else
              echo "Deployment planner unavailable or failed at target commit; using safe full deployment fallback."
              [ ! -s "$PLAN_ERROR" ] || cat "$PLAN_ERROR" >&2
              NEED_DEPS=true
              NEED_COMMAND_SYNC=true
              NEED_DASHBOARD_BUILD=true
              NEED_APP_RELOAD=true
              NEED_DOCTOR=true
              FULL_FALLBACK=true
              CHANGED_COUNT=0
              AFFECTED_SYSTEMS=fallback
              AFFECTED_COMMANDS=
            fi
            rm -f "$PLAN_ERROR"

            if [ "$FORCE_COMMAND_SYNC" = "true" ]; then
              echo "Manual deployment: forcing full Discord command reconciliation."
              NEED_COMMAND_SYNC=true
            fi

            if [ -n "$OLD_SHA" ] && git cat-file -e "$OLD_SHA^{commit}" 2>/dev/null; then
              if git diff --name-only "$OLD_SHA" "$EXPECTED_SHA" | grep -Eq '^src/core/panels/(user/user|mod/mod)\.js$'; then
                echo "Special command definition changed: forcing Discord command reconciliation."
                NEED_COMMAND_SYNC=true
              fi
            fi

            if [ "$NEED_DEPS" = true ] || ! node -e "require.resolve('express')" >/dev/null 2>&1; then
              npm ci
            fi

            if [ "$NEED_DOCTOR" = true ]; then
              BOT_MODE="$ENVIRONMENT" npm run doctor
            fi

            if [ "$NEED_DASHBOARD_BUILD" = true ]; then
              rm -rf dist
              npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
              DASHBOARD_ROOT="$(awk '$1 == "rm" && $2 == "-rf" && $3 ~ /^\/var\/www\// { print $3; exit }' "$DEPLOY_SCRIPT" 2>/dev/null || true)"
              [ -n "$DASHBOARD_ROOT" ] || { [ "$ENVIRONMENT" != dev ] || DASHBOARD_ROOT="/var/www/goliath-dashboard"; }
              case "$DASHBOARD_ROOT" in /var/www/*) ;; *) echo "Unsafe dashboard root"; exit 1 ;; esac
              rm -rf "$DASHBOARD_ROOT"; mkdir -p "$DASHBOARD_ROOT"
              cp -a dist/. "$DASHBOARD_ROOT/"
              nginx -t && systemctl reload nginx
            fi

            if [ "$NEED_COMMAND_SYNC" = true ]; then
              BOT_MODE="$ENVIRONMENT" COMMAND_SYNC_DELETE_STALE=true COMMAND_SYNC_UPDATE_EXISTING=true node -e "require('./src/core/commands/syncCommands').syncCommands().then(() => process.exit(0)).catch((error) => { console.error(error); process.exit(1); })"
            fi

            if [ "$NEED_APP_RELOAD" = true ]; then
              if pm2 describe "$PM2_NAME" >/dev/null 2>&1; then
                pm2 restart "$PM2_NAME" --update-env
              else
                BOT_MODE="$ENVIRONMENT" NODE_ENV="$([ "$ENVIRONMENT" = production ] && echo production || echo development)" pm2 start server.js --name "$PM2_NAME" --cwd "$APP_DIR"
              fi
              pm2 save
              sleep 3
              STATUS="$(pm2 jlist | PM2_TARGET="$PM2_NAME" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const p=a.find(x=>x.name===process.env.PM2_TARGET);process.stdout.write(p?.pm2_env?.status||'missing')})")"
              [ "$STATUS" = online ] || { pm2 logs "$PM2_NAME" --lines 80 --nostream || true; exit 1; }
            fi

            [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ] || exit 1
            # Runtime was restored immediately after checkout. Do not restore it again
            # after PM2 starts because the live process may already have written newer
            # runtime state; a second restore can both overwrite that state and make a
            # successful deploy return a late non-zero tar status.
            trap - EXIT
            rm -rf "$BACKUP_DIR"
            echo "Deployment completed successfully at $EXPECTED_SHA."

      - name: Summary
        run: |
          echo "### 🚀 Goliath deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: **${{ needs.resolve.outputs.environment }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source branch: **${{ needs.resolve.outputs.source_branch }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target branch: **${{ needs.resolve.outputs.target_branch }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployed SHA: **${{ needs.promote.outputs.deploy_sha }}**" >> "$GITHUB_STEP_SUMMARY"
