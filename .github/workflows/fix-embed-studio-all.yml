name: Fix Embed Studio reported issues

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/fix-embed-studio-all.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply repairs
        run: node scripts/fix-embed-studio-all.js
      - name: Validate syntax
        run: npm run syntax
      - name: Commit repairs
        run: |
          git config user.name "KSJHub"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/messageStudio/embed/embedPanel.js
          git add src/modules/messageStudio/embed/embedMedia.js
          git add src/modules/messageStudio/embed/embedMediaManagerBase.js
          git add src/modules/messageStudio/embed/embedRenderer.js
          git commit -m "fix(embed): repair studio flow media options and image alignment"
          git push origin dev
