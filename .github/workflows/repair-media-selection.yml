name: Repair media selection handler

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/repair-media-selection.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Restore and patch
        run: |
          git show e9f12bd748bc875af8f73eb980fc06d0086572e2:src/modules/messageStudio/embed/embedInteractions.js > src/modules/messageStudio/embed/embedInteractions.js
          python - <<'PY'
          from pathlib import Path
          p=Path('src/modules/messageStudio/embed/embedInteractions.js')
          s=p.read_text()
          old="    const panelMedia = panel.getPanelMedia(state);\n    const galleryIndex = Number.isInteger(state.selectedMediaIndex) ? state.selectedMediaIndex : null;\n    const fileIndex = Number.isInteger(state.selectedFileIndex) ? state.selectedFileIndex : null;"
          new="    const panelMedia = panel.getPanelMedia(state);\n    const requestedGalleryIndex = Number.isInteger(state.selectedMediaIndex) ? state.selectedMediaIndex : null;\n    const galleryIndex = panelMedia.gallery.length ? Math.max(0, Math.min(requestedGalleryIndex ?? 0, panelMedia.gallery.length - 1)) : null;\n    const requestedFileIndex = Number.isInteger(state.selectedFileIndex) ? state.selectedFileIndex : null;\n    const fileIndex = panelMedia.files.length ? Math.max(0, Math.min(requestedFileIndex ?? 0, panelMedia.files.length - 1)) : null;"
          if old not in s: raise SystemExit('selection block not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check src/modules/messageStudio/embed/embedInteractions.js
      - name: Commit repair
        run: |
          rm .github/workflows/repair-media-selection.yml
          git config user.name "KSJHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/modules/messageStudio/embed/embedInteractions.js .github/workflows/repair-media-selection.yml
          git commit -m "fix(embed): align media handler selection with UI"
          git push origin HEAD:dev
