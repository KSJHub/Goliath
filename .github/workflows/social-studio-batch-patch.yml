name: Social Studio batch patch
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/social-studio-batch-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply Social Studio fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected pattern not found in {path}: {old[:120]!r}')
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          tiktok = 'src/modules/socialStudio/socialAlerts/providers/tiktok.js'
          monitor = 'src/modules/socialStudio/socialAlerts/socialStudioMonitor.js'

          replace(tiktok,
              "function tiktokApiResult(json, fallbackUsername, fallbackId, source) {",
              "function stableTikTokLiveEventId(roomId, priorLiveEventId = '') {\n  const room = clean(roomId);\n  const prior = clean(priorLiveEventId);\n  // If a public-page fallback had to create a synthetic id, keep it for the\n  // remainder of that LIVE so API recovery cannot look like a second broadcast.\n  if (prior.startsWith('tiktok-live:')) return prior;\n  return room || prior;\n}\n\nfunction tiktokApiResult(json, fallbackUsername, fallbackId, source, priorLiveEventId = '') {")

          replace(tiktok,
              "      id: roomId,",
              "      id: stableTikTokLiveEventId(roomId, priorLiveEventId),")

          replace(tiktok,
              "  const errors = [];",
              "  const errors = [];\n  const priorLiveEventId = account?.state?.isLive === true ? clean(account.state.liveEventId) : '';", 1)

          replace(tiktok,
              "      const resolved = tiktokApiResult(json, username, userId, 'tiktok_api_live_username');",
              "      const resolved = tiktokApiResult(json, username, userId, 'tiktok_api_live_username', priorLiveEventId);")
          replace(tiktok,
              "      const resolved = tiktokApiResult(json, username, userId, 'tiktok_api_live_id');",
              "      const resolved = tiktokApiResult(json, username, userId, 'tiktok_api_live_id', priorLiveEventId);")
          replace(tiktok,
              "              id: sigiRoomId,",
              "              id: stableTikTokLiveEventId(sigiRoomId, priorLiveEventId),")
          replace(tiktok,
              "        id: pageRoomId || `tiktok-live:${username}` ,",
              "        id: stableTikTokLiveEventId(pageRoomId, priorLiveEventId) || `tiktok-live:${username.toLowerCase()}` ,") if "        id: pageRoomId || `tiktok-live:${username}` ," in Path(tiktok).read_text(encoding='utf-8') else None
          replace(tiktok,
              "        id: pageRoomId || `tiktok-live:${username}` ,".replace('}` ,','}`,').replace('  ', '  '),
              "        id: stableTikTokLiveEventId(pageRoomId, priorLiveEventId) || `tiktok-live:${username.toLowerCase()}`,") if "        id: pageRoomId || `tiktok-live:${username}`," in Path(tiktok).read_text(encoding='utf-8') else None

          # The wrapper's parity pass was cache-busting TikTok's still image even
          # though the core intentionally keeps TikTok artwork static.
          replace(monitor,
              "  if (settings.includeThumbnails !== false) { const image = cacheBust(event.thumbnail || event.thumbnailUrl || event.previewImage || ''); if (image) embed.setImage(image); }",
              "  if (settings.includeThumbnails !== false) { const rawImage = event.thumbnail || event.thumbnailUrl || event.previewImage || ''; const image = String(account?.platform || '').toLowerCase() === 'tiktok' ? clean(rawImage, 1000) : cacheBust(rawImage); if (image) embed.setImage(image); }")

          # Preserve PAUSED through the wrapper parity layer instead of flattening
          # every isLive=true result back to LIVE.
          replace(monitor,
              "function liveStatusFor(result, before) { if (result?.isLive === true) return 'LIVE'; if (before?.state?.isLive === true && result?.isLive === false) return 'OFFLINE'; return null; }",
              "function liveStatusFor(result, before) { if (result?.isLive === true) return result?.live?.paused === true || String(result?.live?.liveStatus || '').toUpperCase() === 'PAUSED' ? 'PAUSED' : 'LIVE'; if (before?.state?.isLive === true && result?.isLive === false) return 'OFFLINE'; return null; }")

          # Guard wrapper duration parity with the same 48h ceiling used by core.
          replace(monitor,
              "function parityFields(account, event, liveStatus, settings) { const startedAt = event?.startedAt || account?.state?.liveStartedAt || null; const endedAt = liveStatus === 'OFFLINE' ? event?.endedAt || account?.state?.lastLiveEndedAt || new Date().toISOString() : null; const seconds = Number.isFinite(Number(event?.durationSeconds)) ? Number(event.durationSeconds) : secondsBetween(startedAt, endedAt || new Date().toISOString());",
              "function parityFields(account, event, liveStatus, settings) { const startedAt = event?.startedAt || account?.state?.liveStartedAt || null; const endedAt = liveStatus === 'OFFLINE' ? event?.endedAt || account?.state?.lastLiveEndedAt || new Date().toISOString() : null; const rawSeconds = Number.isFinite(Number(event?.durationSeconds)) ? Number(event.durationSeconds) : secondsBetween(startedAt, endedAt || new Date().toISOString()); const seconds = Number.isFinite(rawSeconds) && rawSeconds >= 0 && rawSeconds <= 48 * 60 * 60 ? rawSeconds : null;")

          # A parity edit must never turn a PAUSED card's image into a fresh URL;
          # also keep the PAUSED footer/status already produced by core intact.

          wf = Path('.github/workflows/social-studio-batch-patch.yml')
          wf.unlink()
      - name: Validate JavaScript
        run: |
          node --check src/modules/socialStudio/socialAlerts/providers/tiktok.js
          node --check src/modules/socialStudio/socialAlerts/socialStudioMonitor.js
          node --check src/modules/socialStudio/socialAlerts/socialStudioMonitorCore.js
      - name: Commit fixes
        run: |
          git config user.name "KSJ Goliath Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(social): harden TikTok recovery and parity"
          git push origin HEAD:dev
