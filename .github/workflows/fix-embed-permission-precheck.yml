name: Apply API-first Embed Permission Handling

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: embed-permission-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Patch Embed Studio
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/modules/embed/embedPanel.js")
          text = path.read_text(encoding="utf-8")

          old = '''  if (!access.ok)
    return i.reply({ content: trim(access.message, 1800), flags: 64 });'''
          new_update = '''  if (!access.ok) {
    console.warn("Embed update permission pre-check failed; attempting Discord API operation anyway.", {
      guildId: i.guild.id,
      channelId: channel.id,
      botId: i.guild.members.me?.id || i.client.user?.id || null,
      missingPermissions: access.missingPermissions,
    });
  }'''
          new_deploy = '''  if (!access.ok) {
    console.warn("Embed deploy permission pre-check failed; attempting Discord API operation anyway.", {
      guildId: i.guild.id,
      channelId: channel.id,
      botId: i.guild.members.me?.id || i.client.user?.id || null,
      missingPermissions: access.missingPermissions,
    });
  }'''

          first = text.find(old)
          if first == -1:
            raise SystemExit("update permission pre-check block not found")
          text = text[:first] + new_update + text[first + len(old):]

          second = text.find(old, first + len(new_update))
          if second == -1:
            raise SystemExit("deploy permission pre-check block not found")
          text = text[:second] + new_deploy + text[second + len(old):]

          path.write_text(text, encoding="utf-8")

      - name: Validate source
        run: node --check src/modules/embed/embedPanel.js

      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-embed-permission-precheck.yml

      - name: Commit permanent fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/embed/embedPanel.js
          git add -u .github/workflows
          git commit -m "fix: let Discord API decide embed channel access"
          git push origin dev
