name: Apply welcome avatar refresh fix

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-welcome-avatar-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Patch welcome avatar handling
        shell: python
        run: |
          from pathlib import Path

          manager = Path('src/modules/welcome/welcomeManager.js')
          text = manager.read_text(encoding='utf-8')

          old = """function getAvatar(member) {
  return member?.displayAvatarURL?.({ extension: 'png', size: 256 }) || member?.user?.displayAvatarURL?.({ extension: 'png', size: 256 }) || '';
}"""
          new = """function getUserAvatar(member) {
  return member?.user?.displayAvatarURL?.({ extension: 'png', size: 256, forceStatic: false }) || '';
}

function getMemberAvatar(member) {
  return member?.displayAvatarURL?.({ extension: 'png', size: 256, forceStatic: false }) || getUserAvatar(member);
}"""
          if old not in text:
              raise SystemExit('welcomeManager avatar helper not found')
          text = text.replace(old, new, 1)

          old = """    userAvatar: getAvatar(member),
    memberAvatar: getAvatar(member),"""
          new = """    userAvatar: getUserAvatar(member),
    memberAvatar: getMemberAvatar(member),
    userServerAvatar: getMemberAvatar(member),"""
          if old not in text:
              raise SystemExit('welcomeManager avatar variables not found')
          text = text.replace(old, new, 1)

          old = """async function sendWelcome(member, options = {}) {
  if (!member?.guild?.id || !member?.user?.id) return { publicSent: false, dmSent: false, skipped: true };

  const config = welcomeStore.getWelcomeSection(member.guild.id);"""
          new = """async function sendWelcome(member, options = {}) {
  if (!member?.guild?.id || !member?.user?.id) return { publicSent: false, dmSent: false, skipped: true };

  // Always render from Discord's latest member/user state so newly changed global
  // and server-specific avatars are never taken from a stale gateway cache.
  const freshMember = await member.guild.members.fetch({ user: member.user.id, force: true }).catch(() => member);
  member = freshMember || member;
  await member.user.fetch(true).catch(() => null);

  const config = welcomeStore.getWelcomeSection(member.guild.id);"""
          if old not in text:
              raise SystemExit('welcomeManager sendWelcome header not found')
          text = text.replace(old, new, 1)

          manager.write_text(text, encoding='utf-8')

          sync = Path('src/modules/welcome/welcomeAvatarSync.js')
          text = sync.read_text(encoding='utf-8')
          text = text.replace("member.displayAvatarURL({ extension: 'png', size: 256 })", "member.displayAvatarURL({ extension: 'png', size: 256, forceStatic: false })")
          text = text.replace("guild.members.fetch(newUser.id).catch(() => null)", "guild.members.fetch({ user: newUser.id, force: true }).catch(() => null)")
          text = text.replace("newMember.displayAvatarURL?.({ extension: 'png', size: 256 })", "newMember.displayAvatarURL?.({ extension: 'png', size: 256, forceStatic: false })")
          text = text.replace("oldMember.displayAvatarURL?.({ extension: 'png', size: 256 })", "oldMember.displayAvatarURL?.({ extension: 'png', size: 256, forceStatic: false })")
          sync.write_text(text, encoding='utf-8')

          event = Path('src/events/members/memberAvatarUpdate.js')
          text = event.read_text(encoding='utf-8')
          old = """  async execute(oldMember, newMember) {
    await welcomeAvatarSync
      .handleGuildMemberAvatarUpdate(oldMember, newMember, welcomeManager)"""
          new = """  async execute(oldMember, newMember) {
    const freshMember = await newMember.guild.members.fetch({ user: newMember.id, force: true }).catch(() => newMember);
    await freshMember.user.fetch(true).catch(() => null);
    await welcomeAvatarSync
      .handleGuildMemberAvatarUpdate(oldMember, freshMember, welcomeManager)"""
          if old not in text:
              raise SystemExit('memberAvatarUpdate handler not found')
          text = text.replace(old, new, 1)
          event.write_text(text, encoding='utf-8')

      - name: Syntax check
        run: |
          node --check src/modules/welcome/welcomeManager.js
          node --check src/modules/welcome/welcomeAvatarSync.js
          node --check src/events/members/memberAvatarUpdate.js

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-welcome-avatar-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/welcome/welcomeManager.js src/modules/welcome/welcomeAvatarSync.js src/events/members/memberAvatarUpdate.js .github/workflows/apply-welcome-avatar-fix.yml
          git commit -m "fix: refresh welcome avatars from Discord"
          git push origin dev
