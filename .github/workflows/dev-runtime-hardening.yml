name: DEV Runtime Hardening

# Runtime hardening belongs in source control. CI must verify those invariants,
# never rewrite source and push another DEV commit (which would trigger another
# deployment/restart cycle).
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden:
    name: Verify DEV runtime hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - run: npm run build
      - name: Verify runtime hardening invariants
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const assert = require('node:assert/strict');

          const maintenance = fs.readFileSync('src/owner/dev/maintenanceStatus.js', 'utf8');
          assert(maintenance.includes('message.system !== true'));
          assert(maintenance.includes('message.editable !== false'));

          const bootstrap = fs.readFileSync('src/runtime/runtimeBootstrap.js', 'utf8');
          assert(bootstrap.includes('setMaxListeners'));
          assert(bootstrap.includes('Math.max(client.getMaxListeners(), 25)'));

          const duplicator = fs.readFileSync('src/owner/dev/duplicator/core.js', 'utf8');
          assert(duplicator.includes('bridgeUnavailable'));
          assert(duplicator.includes("error?.code === 'EADDRINUSE'"));

          console.log('✅ DEV runtime hardening invariants verified');
