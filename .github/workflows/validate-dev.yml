name: Validate DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate backend, imports and runtime contracts
        run: npm run doctor

      - name: Audit Embed Graphic Headers
        run: node test/auditEmbedGraphicHeaders.js

      - name: Build dashboard
        run: npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
