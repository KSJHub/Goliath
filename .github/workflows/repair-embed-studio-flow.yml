name: Repair Embed Studio flow

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/repair-embed-studio-flow.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply repairs
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              p.write_text(text.replace(old, new, 1))

          panel = 'src/modules/messageStudio/embed/embedPanel.js'
          old = '''      /*
       * PRIMARY WORKFLOW
       */
      new ActionRowBuilder().addComponents(
        new ButtonBuilder()
          .setCustomId("embed:builder")
          .setLabel("Builder")
          .setEmoji("🛠️")
          .setStyle(ButtonStyle.Primary),

        new ButtonBuilder()
          .setCustomId("embed:presets")
          .setLabel("Presets")
          .setEmoji("💾")
          .setStyle(ButtonStyle.Primary),

        new ButtonBuilder()
          .setCustomId("embed:readiness")
          .setLabel(
            report.ready
              ? "Ready"
              : "Review"
          )
          .setEmoji(
            report.ready
              ? "✅"
              : "⚠️"
          )
          .setStyle(
            report.ready
              ? ButtonStyle.Success
              : ButtonStyle.Secondary
          )
      ),

      /*
       * DEPLOYMENT WORKFLOW
       */
      new ActionRowBuilder().addComponents(
        new ButtonBuilder()
          .setCustomId("embed:panels")
          .setLabel(`Panels (${panels.length})`)
          .setEmoji("🧩")
          .setStyle(ButtonStyle.Secondary),

        new ButtonBuilder()
          .setCustomId("embed:test-send")
          .setLabel("Test Send")
          .setEmoji("🧪")
          .setStyle(ButtonStyle.Secondary)
          .setDisabled(!report.ready),

        new ButtonBuilder()
          .setCustomId("embed:use")
          .setLabel("Deploy New")
          .setEmoji("🚀")
          .setStyle(ButtonStyle.Success)
          .setDisabled(!canDeploy),

        ...(deployment
          ? [
              new ButtonBuilder()
                .setCustomId("embed:update-existing")
                .setLabel("Update Existing")
                .setEmoji("♻️")
                .setStyle(ButtonStyle.Success)
                .setDisabled(!canDeploy),
            ]
          : [])
      ),'''
          new = '''      /*
       * BUILD WORKFLOW
       * Keep editing/navigation together before validation and publishing.
       */
      new ActionRowBuilder().addComponents(
        new ButtonBuilder()
          .setCustomId("embed:builder")
          .setLabel("Builder")
          .setEmoji("🛠️")
          .setStyle(ButtonStyle.Primary),

        new ButtonBuilder()
          .setCustomId("embed:panels")
          .setLabel(`Panels (${panels.length})`)
          .setEmoji("🧩")
          .setStyle(ButtonStyle.Primary),

        new ButtonBuilder()
          .setCustomId("embed:presets")
          .setLabel("Presets")
          .setEmoji("💾")
          .setStyle(ButtonStyle.Primary)
      ),

      /*
       * CHECK / PUBLISH WORKFLOW
       * Natural left-to-right flow: review -> test -> deploy -> update.
       */
      new ActionRowBuilder().addComponents(
        new ButtonBuilder()
          .setCustomId("embed:readiness")
          .setLabel(
            report.ready
              ? "Ready"
              : "Review"
          )
          .setEmoji(
            report.ready
              ? "✅"
              : "⚠️"
          )
          .setStyle(
            report.ready
              ? ButtonStyle.Success
              : ButtonStyle.Secondary
          ),

        new ButtonBuilder()
          .setCustomId("embed:test-send")
          .setLabel("Test Send")
          .setEmoji("🧪")
          .setStyle(ButtonStyle.Secondary)
          .setDisabled(!report.ready),

        new ButtonBuilder()
          .setCustomId("embed:use")
          .setLabel("Deploy New")
          .setEmoji("🚀")
          .setStyle(ButtonStyle.Success)
          .setDisabled(!canDeploy),

        ...(deployment
          ? [
              new ButtonBuilder()
                .setCustomId("embed:update-existing")
                .setLabel("Update Existing")
                .setEmoji("♻️")
                .setStyle(ButtonStyle.Success)
                .setDisabled(!canDeploy),
            ]
          : [])
      ),'''
          replace_once(panel, old, new)

          media = 'src/modules/messageStudio/embed/embedMedia.js'
          replace_once(media,
              "const index = Number.isInteger(state.selectedMediaIndex) && media.gallery[state.selectedMediaIndex] ? state.selectedMediaIndex : null;",
              "const index = media.gallery.length ? Math.max(0, Math.min(Number.isInteger(state.selectedMediaIndex) ? state.selectedMediaIndex : 0, media.gallery.length - 1)) : null;")
          replace_once(media,
              "const index = Number.isInteger(state.selectedFileIndex) && media.files[state.selectedFileIndex] ? state.selectedFileIndex : null;",
              "const index = media.files.length ? Math.max(0, Math.min(Number.isInteger(state.selectedFileIndex) ? state.selectedFileIndex : 0, media.files.length - 1)) : null;")
          # filePreview has the same stale-selection bug; keep previews/options consistent.
          replace_once(media,
              "const index = Number.isInteger(state.selectedFileIndex) && media.files[state.selectedFileIndex] ? state.selectedFileIndex : null;",
              "const index = media.files.length ? Math.max(0, Math.min(Number.isInteger(state.selectedFileIndex) ? state.selectedFileIndex : 0, media.files.length - 1)) : null;")

          manager = 'src/modules/messageStudio/embed/embedMediaManagerBase.js'
          replace_once(manager, "'⚙️ Options',", "'⚙️ Media Options',")
          replace_once(manager, "'⚙️ File Options',", "'⚙️ Attachment Options',")

      - name: Validate syntax
        run: npm run syntax
      - name: Commit repair
        run: |
          git config user.name "KSJHub"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/messageStudio/embed/embedPanel.js src/modules/messageStudio/embed/embedMedia.js src/modules/messageStudio/embed/embedMediaManagerBase.js
          git commit -m "fix(embed): rebalance studio flow and repair media options"
          git push origin dev
      - name: Remove temporary workflow
        if: success()
        run: |
          git pull --rebase origin dev
          git rm .github/workflows/repair-embed-studio-flow.yml
          git commit -m "chore: remove temporary Embed Studio repair workflow"
          git push origin dev
