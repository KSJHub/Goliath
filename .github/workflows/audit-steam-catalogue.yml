name: Audit Steam Game Catalogue

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of Steam catalogue entries to check'
        required: true
        default: '20'
        type: string
      offset:
        description: 'Zero-based catalogue offset'
        required: true
        default: '0'
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Read-only Steam identity audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Steam catalogue identities (no writes)
        env:
          AUDIT_LIMIT: ${{ inputs.limit }}
          AUDIT_OFFSET: ${{ inputs.offset }}
        run: |
          node - <<'NODE'
          const limit = process.env.AUDIT_LIMIT;
          const offset = process.env.AUDIT_OFFSET;
          const { UPDATE_CATALOG } = require('./src/modules/utilityStudio/games/freeGamesProviders');
          const catalogueSize = UPDATE_CATALOG.length;
          if (!/^[1-9]\d*$/.test(limit) || !/^(0|[1-9]\d*)$/.test(offset) ||
              !Number.isSafeInteger(Number(limit)) || !Number.isSafeInteger(Number(offset)) ||
              Number(limit) > catalogueSize || Number(offset) >= catalogueSize || Number(limit) + Number(offset) > catalogueSize) {
            console.error(`Choose a positive limit and non-negative offset within the ${catalogueSize} Steam entries.`);
            process.exit(1);
          }
          NODE
          node scripts/goliath.js game-catalogue-identity "$AUDIT_LIMIT" "$AUDIT_OFFSET"
