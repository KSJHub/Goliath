name: Sync Goliath

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-goliath-dev
  cancel-in-progress: false

jobs:
  sync-dev:
    name: Validate, build and sync DEV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sync and verify DEV
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GITHUB_DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          envs: EXPECTED_SHA,GITHUB_DEPLOY_TOKEN
          script: |
            set -euo pipefail
            APP_DIR=/home/goliath/dev
            RUNTIME_DIR="$APP_DIR/src/runtime/dev"
            PM2_NAME=goliath-dev
            DEV_HOST=dev.goliath.ksjdigital.co.uk
            BACKUP_DIR=/home/goliath/.goliath-dev-runtime-sync-backup
            LOCK_FILE=/home/goliath/.goliath-dev-sync.lock

            # Serialize on the VPS as well as in GitHub Actions. This protects the
            # shared DEV worktree/node_modules even if an SSH runner disconnects.
            exec 9>"$LOCK_FILE"
            echo "🔒 Waiting for DEV deployment lock"
            flock -w 900 9 || { echo "Timed out waiting for DEV deployment lock." >&2; exit 1; }
            echo "🔒 DEV deployment lock acquired"

            cd "$APP_DIR"

            AUTH_URL="https://x-access-token:${GITHUB_DEPLOY_TOKEN}@github.com/${{ github.repository }}.git"
            git remote set-url origin "$AUTH_URL"
            cleanup_remote() { git remote set-url origin "https://github.com/${{ github.repository }}.git" || true; }
            trap cleanup_remote EXIT

            retry_git() {
              local attempt=1
              local max_attempts=5
              local delay=3
              while true; do
                if "$@"; then return 0; fi
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "GitHub operation failed after ${max_attempts} attempts: $*" >&2
                  return 1
                fi
                echo "⚠️ GitHub operation failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..." >&2
                sleep "$delay"
                attempt=$((attempt + 1))
                delay=$((delay * 2))
              done
            }
            remote_dev_sha() {
              local output
              output="$(retry_git git ls-remote origin refs/heads/dev)" || return 1
              printf '%s\n' "$output" | awk 'NR==1 {print $1}'
            }
            ensure_expected_commit() {
              git cat-file -e "$EXPECTED_SHA^{commit}" 2>/dev/null || retry_git git fetch --no-tags origin "$EXPECTED_SHA"
            }

            LATEST_SHA="$(remote_dev_sha)"
            [ -n "$LATEST_SHA" ] || { echo "Unable to resolve remote DEV SHA." >&2; exit 1; }
            [ "$EXPECTED_SHA" = "$LATEST_SHA" ] || { echo "Superseded before sync; exiting cleanly."; exit 0; }
            ensure_expected_commit

            # DEV SAFETY CONTRACT:
            # Never reset, clean, stash, overwrite, or otherwise modify a dirty
            # DEV worktree. A push may arrive while local development is active.
            # In that case deployment must stop and leave every local change intact.
            DIRTY_STATUS="$(git status --porcelain -- . ':!src/runtime/')"
            if [ -n "$DIRTY_STATUS" ]; then
              echo "❌ DEV sync refused: /home/goliath/dev contains local changes."
              echo "The DEV worktree has been left completely untouched."
              echo
              printf '%s\n' "$DIRTY_STATUS"
              echo
              echo "DEV sync deferred safely. Commit or otherwise resolve the local DEV changes, then sync again."
              exit 0
            fi

            rm -rf "$BACKUP_DIR" && mkdir -p "$BACKUP_DIR"
            if [ -d "$RUNTIME_DIR" ]; then
              tar --warning=no-file-changed --ignore-failed-read --exclude='*.tmp' -C "$RUNTIME_DIR" -cf - . | tar -C "$BACKUP_DIR" -xf -
            fi
            restore_runtime() {
              mkdir -p "$RUNTIME_DIR"
              rm -rf "$RUNTIME_DIR"/* "$RUNTIME_DIR"/.[!.]* "$RUNTIME_DIR"/..?* 2>/dev/null || true
              [ ! -d "$BACKUP_DIR" ] || tar -C "$BACKUP_DIR" -cf - . | tar -C "$RUNTIME_DIR" -xf -
            }
            finish() { status=$?; restore_runtime || true; rm -rf "$BACKUP_DIR"; cleanup_remote; exit "$status"; }
            trap finish EXIT

            git reset --hard "$EXPECTED_SHA"
            restore_runtime

            echo "📦 Clean locked dependency install"
            rm -rf node_modules
            npm ci --no-audit --no-fund

            echo "🔧 Verify native/runtime dependencies"
            node - <<'NODE'
            for (const name of ['googleapis','better-sqlite3','discord.js','express','sharp','socket.io']) {
              try { require(name); console.log(`✅ ${name}`); }
              catch (error) { console.error(`❌ ${name}: ${error.stack || error.message}`); process.exit(1); }
            }
            const Database = require('better-sqlite3');
            const db = new Database(':memory:');
            db.prepare('select 1 as ok').get();
            db.close();
            console.log('✅ better-sqlite3 native binding operational');
            NODE

            echo "🔎 Validate DEV"
            BOT_MODE=dev npm run doctor
            node scripts/goliath.js embed-graphic-headers
            node - <<'NODE'
            const fs=require('node:fs'),assert=require('node:assert/strict');
            const maintenance=fs.readFileSync('src/owner/dev/maintenanceStatus.js','utf8');
            assert(maintenance.includes('message.system !== true'));
            assert(maintenance.includes('message.editable !== false'));
            const bootstrap=fs.readFileSync('src/runtime/runtimeBootstrap.js','utf8');
            assert(bootstrap.includes('setMaxListeners'));
            const duplicator=fs.readFileSync('src/owner/dev/duplicator/core.js','utf8');
            assert(duplicator.includes('bridgeUnavailable'));
            console.log('✅ DEV runtime invariants verified');
            NODE

            echo "🏗️ Build dashboard"
            rm -rf dist
            npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
            mkdir -p dist/appeals && cp dist/index.html dist/appeals/index.html
            grep -q 'GOLIATH_APPEALS_ENTRY' dist/assets/*.js

            LATEST_SHA="$(remote_dev_sha)"
            [ "$EXPECTED_SHA" = "$LATEST_SHA" ] || { echo "Superseded during validation; exiting cleanly."; exit 0; }

            NGINX_DUMP="$(nginx -T 2>&1)"
            DASHBOARD_ROOT="$(printf '%s\n' "$NGINX_DUMP" | awk -v host="$DEV_HOST" '$1=="server_name"{for(i=2;i<=NF;i++){n=$i;gsub(/;/,"",n);if(n==host)found=1}next} found&&$1=="root"{r=$2;gsub(/;/,"",r);print r;exit}')"
            case "$DASHBOARD_ROOT" in /var/www/*) ;; *) echo "Unsafe dashboard root" >&2; exit 1;; esac
            rm -rf "$DASHBOARD_ROOT" && mkdir -p "$DASHBOARD_ROOT" && cp -a dist/. "$DASHBOARD_ROOT/"
            nginx -t && systemctl reload nginx

            BOT_MODE=dev COMMAND_SYNC_DELETE_STALE=true COMMAND_SYNC_UPDATE_EXISTING=true node -e "require('./src/core/commands/syncCommands').syncCommands().then(()=>process.exit(0)).catch(e=>{console.error(e);process.exit(1)})"

            LATEST_SHA="$(remote_dev_sha)"
            [ "$EXPECTED_SHA" = "$LATEST_SHA" ] || { echo "Superseded before restart; exiting cleanly."; exit 0; }

            echo "♻️ One controlled PM2 reload from ecosystem config"
            pm2 delete "$PM2_NAME" >/dev/null 2>&1 || true
            BOT_MODE=dev NODE_ENV=development pm2 start ecosystem.config.js --only "$PM2_NAME" --update-env
            pm2 save

            NEW_PID="$(pm2 pid "$PM2_NAME" | tail -n1 | tr -d '[:space:]')"
            if [ -z "$NEW_PID" ] || [ "$NEW_PID" = "0" ]; then
              echo "DEV PM2 process did not start." >&2
              pm2 logs "$PM2_NAME" --lines 120 --nostream || true
              exit 1
            fi

            sleep 18

            STABLE_PID="$(pm2 pid "$PM2_NAME" | tail -n1 | tr -d '[:space:]')"
            if [ -z "$STABLE_PID" ] || [ "$STABLE_PID" = "0" ]; then
              echo "DEV PM2 process is not running after stability gate." >&2
              pm2 logs "$PM2_NAME" --lines 120 --nostream || true
              exit 1
            fi
            if [ "$NEW_PID" != "$STABLE_PID" ]; then
              echo "DEV crashed/restarted during 18s stability gate: $NEW_PID -> $STABLE_PID" >&2
              pm2 logs "$PM2_NAME" --lines 120 --nostream || true
              exit 1
            fi
            if ! kill -0 "$STABLE_PID" 2>/dev/null; then
              echo "DEV PID $STABLE_PID is not alive." >&2
              pm2 logs "$PM2_NAME" --lines 120 --nostream || true
              exit 1
            fi

            # A newer DEV push may arrive while this run is inside the stability
            # gate. That makes this run stale, not failed. Leave the newer workflow
            # to deploy the newer commit instead of reporting a false SHA mismatch.
            REMOTE_SHA="$(remote_dev_sha)"
            if [ "$EXPECTED_SHA" != "$REMOTE_SHA" ]; then
              echo "Superseded during stability gate; exiting cleanly."
              exit 0
            fi

            FINAL_SHA="$(git rev-parse HEAD)"
            if [ "$FINAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "DEV SHA mismatch: local=$FINAL_SHA expected=$EXPECTED_SHA" >&2
              exit 1
            fi

            PROCESS_CWD="$(readlink -f /proc/$STABLE_PID/cwd 2>/dev/null || true)"
            echo "DEV process cwd: ${PROCESS_CWD:-unknown}"
            if [ -z "$PROCESS_CWD" ]; then
              echo "Unable to resolve DEV process cwd for PID $STABLE_PID." >&2
              exit 1
            fi
            if [ "$PROCESS_CWD" != "$APP_DIR" ]; then
              echo "DEV process cwd differs from app dir: $PROCESS_CWD != $APP_DIR" >&2
              exit 1
            fi

            DIRECT_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/auth/me || true)"
            PUBLIC_STATUS="$(curl -ksS -o /dev/null -w '%{http_code}' https://$DEV_HOST/api/auth/me || true)"
            case "$DIRECT_STATUS" in 200|401) ;; *) echo "Direct health failed: $DIRECT_STATUS" >&2; pm2 logs "$PM2_NAME" --lines 120 --nostream || true; exit 1;; esac
            case "$PUBLIC_STATUS" in 200|401) ;; *) echo "Public health failed: $PUBLIC_STATUS" >&2; pm2 logs "$PM2_NAME" --lines 120 --nostream || true; exit 1;; esac

            echo "✅ DEV stable: sha=$FINAL_SHA pid=$STABLE_PID public=$PUBLIC_STATUS direct=$DIRECT_STATUS"
            restore_runtime
            rm -rf "$BACKUP_DIR"
            trap - EXIT
            cleanup_remote
