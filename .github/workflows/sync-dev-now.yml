name: Sync Goliath

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Migrate variables
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          suggestions_path = Path('src/modules/feedbackStudio/suggestions/suggestionsPanel.js')
          suggestions = suggestions_path.read_text()
          import_line = "const guildVariables = require('../../../core/guild/guildVariables');"
          anchor = "const { isModuleEnabled } = require('../../../core/guild/guildManager');"
          if import_line not in suggestions:
              suggestions = suggestions.replace(anchor, anchor + "\n" + import_line)

          replacement = '''function templateVariables(guild, suggestion = null, section = {}) {
            const enabled = guild?.id ? isModuleEnabled(guild.id, 'suggestions') : true;
            const interaction = { guild, guildId: guild?.id || '' };
            return guildVariables.buildVariableMap(interaction, false, {
              '{suggestionTitle}': suggestion?.title || '',
              '{suggestion}': suggestion?.content || '',
              '{suggestionAuthor}': suggestion ? publicSuggestionAuthor(suggestion) : '',
              '{suggestionStatus}': suggestion ? statusLabel(suggestion.status, section) : '',
              '{upVotes}': String(suggestion?.upVotes?.length || 0),
              '{downVotes}': String(suggestion?.downVotes?.length || 0),
              '{teamResponse}': suggestion ? defaultTeamResponse(suggestion) : '',
              '{submittedAt}': suggestion?.createdAt ? discordTimestamp(suggestion.createdAt, 'F') : '',
              '{decisionAt}': suggestion?.implementedAt || suggestion?.reviewedAt || suggestion?.updatedAt
                ? discordTimestamp(suggestion.implementedAt || suggestion.reviewedAt || suggestion.updatedAt, 'F') : '',
              '{suggestionsEnabled}': enabled ? 'On' : 'Off',
              '{anonymousMode}': section.anonymous === true ? 'On' : 'Off',
            });
          }

          function suggestionTemplateSlot'''
          suggestions, count = re.subn(r"function templateVariables\(guild, suggestion = null, section = \{\}\) \{.*?\n\}\n\nfunction suggestionTemplateSlot", replacement, suggestions, count=1, flags=re.S)
          if count == 0 and 'guildVariables.buildVariableMap(interaction' not in suggestions:
              raise SystemExit('Suggestions migration pattern not found')
          suggestions_path.write_text(suggestions)

          social_path = Path('src/modules/socialStudio/socialAlerts/socialStudioPanel.js')
          social = social_path.read_text()
          social_import = "const guildVariables = require('../../../core/guild/guildVariables');"
          social_anchor = "const security = require('../../../core/security/protection/core');"
          if social_import not in social:
              social = social.replace(social_anchor, social_anchor + "\n" + social_import)

          social_replacement = '''function variablesDescription() {
            const variables = guildVariables.variablesForModule('socialStudio');
            const lines = [];
            for (let index = 0; index < variables.length; index += 8) {
              lines.push(variables.slice(index, index + 8).map((token) => `\\`${token}\\``).join(' '));
            }
            return [
              '**🌐 Goliath Global Variables**',
              ...lines,
              '',
              '*Generated from the central guildVariables registry. Custom DEV-panel variables appear automatically.*',
            ].join('\\n');
          }

          function buildTemplatePanel'''
          social, count = re.subn(r"function variablesDescription\(\) \{.*?\n\nfunction buildTemplatePanel", social_replacement, social, count=1, flags=re.S)
          if count == 0 and "variablesForModule('socialStudio')" not in social:
              raise SystemExit('Social Studio migration pattern not found')
          social_path.write_text(social)

          central = Path('src/core/guild/guildVariables.js').read_text()
          required = ['{suggestionTitle}', '{creatorDisplayName}', '{shortUrl}', 'variablesForModule', 'buildVariableMap']
          missing = [item for item in required if item not in central]
          if missing:
              raise SystemExit('Central registry missing: ' + ', '.join(missing))

          violations = []
          rules = [
              re.compile(r"const\s+(?:AVAILABLE_|TEMPLATE_|EMBED_)?VARIABLES\s*=\s*(?:Object\.freeze\()?\s*\["),
              re.compile(r"function\s+variablesDescription\(\)\s*\{\s*return\s*\[", re.S),
          ]
          for path in Path('src/modules').rglob('*'):
              if path.suffix not in {'.js', '.jsx', '.ts', '.tsx'}:
                  continue
              text = path.read_text(errors='ignore')
              if any(rule.search(text) for rule in rules):
                  violations.append(str(path))
          if violations:
              raise SystemExit('Legacy variable catalogues remain: ' + ', '.join(sorted(set(violations))))
          PY

          node --check src/core/guild/guildVariables.js
          node --check src/modules/feedbackStudio/suggestions/suggestionsPanel.js
          node --check src/modules/socialStudio/socialAlerts/socialStudioPanel.js

          if git diff --quiet; then
            echo "Variable migration already complete."
            exit 0
          fi

          git config user.name "KSJ Goliath Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/modules/feedbackStudio/suggestions/suggestionsPanel.js src/modules/socialStudio/socialAlerts/socialStudioPanel.js
          git commit -m "refactor(variables): centralise remaining module variables"
          git push origin HEAD:dev
