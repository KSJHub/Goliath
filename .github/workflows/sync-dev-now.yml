name: Sync Goliath
on:
  push:
    branches: [dev]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply migration
        env:
          MIGRATION_B64: 
        run: |
          printf '%s' "$MIGRATION_B64" | base64 -d > /tmp/migrate.js
          node /tmp/migrate.js
          node --check src/core/guild/guildVariables.js
          node --check src/modules/feedbackStudio/suggestions/suggestionsPanel.js
          node --check src/modules/socialStudio/socialAlerts/socialStudioPanel.js
          if git diff --quiet; then exit 0; fi
          git config user.name "KSJ Goliath Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/modules/feedbackStudio/suggestions/suggestionsPanel.js src/modules/socialStudio/socialAlerts/socialStudioPanel.js
          git commit -m "refactor(variables): finish central variable migration"
          git push origin HEAD:dev
