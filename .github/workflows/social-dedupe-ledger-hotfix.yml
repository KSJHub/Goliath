name: Social Studio persistent dedupe ledger hotfix
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/social-dedupe-ledger-hotfix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - run: python scripts/socialDedupeLedgerPatch.py
      - run: node --check src/modules/socialStudio/socialAlerts/socialStudioMonitorCore.js && node --check src/modules/socialStudio/socialAlerts/providers/twitch.js
      - run: |
          git config user.name goliath-hotfix
          git config user.email actions@users.noreply.github.com
          git add src/modules/socialStudio/socialAlerts/socialStudioMonitorCore.js src/modules/socialStudio/socialAlerts/providers/twitch.js
          git commit -m 'fix(social): persist delivered content ledger' || exit 0
          git push origin beta
